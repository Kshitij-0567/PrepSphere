# Render blueprint: the PrepSphere API plus its PostgreSQL database.
# The React frontend is deployed separately to Vercel (see frontend/vercel.json).
#
# Render reads this file when you create a Blueprint from the repository. Values
# marked sync:false are filled in once from the Render dashboard, so no secret is
# ever committed here.
services:
  - type: web
    name: prepsphere-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore          # closest Render region to India; frankfurt/oregon also work
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: prepsphere-db
          property: connectionString
      # Generated once by Render and kept for the life of the service. Changing it
      # signs every logged-in user out, because it invalidates existing tokens.
      - key: SECRET_KEY
        generateValue: true
      # The Vercel URL of the frontend, e.g. https://prepsphere.vercel.app
      # Set this after the first Vercel deploy, or sign-in will fail with a CORS error.
      - key: CORS_ORIGINS
        sync: false
      # Optional. Without it, every AI feature falls back to deterministic rules and
      # the interface labels those scores as approximate.
      - key: GEMINI_API_KEY
        sync: false
      # Optional. Needed only for Google Sign-In; must match VITE_GOOGLE_CLIENT_ID.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # Optional. Raises the GitHub import limit from 60 to 5,000 requests an hour.
      - key: GITHUB_TOKEN
        sync: false
      # Render terminates TLS at its proxy, so trust its forwarded client address
      # and rate limits will count real visitors rather than the proxy.
      - key: FORWARDED_ALLOW_IPS
        value: "*"

databases:
  - name: prepsphere-db
    plan: free
    databaseName: prepsphere
    region: singapore
