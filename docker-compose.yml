services:
  prepsphere:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Overrides the local SQLite path from backend/.env with the persistent volume.
      DATABASE_URL: sqlite:////data/interview_prep.db
      CORS_ORIGINS: http://localhost:8000
    volumes:
      - prepsphere-data:/data
    restart: unless-stopped

volumes:
  prepsphere-data:

# Run with: docker compose up --build   then open http://localhost:8000
